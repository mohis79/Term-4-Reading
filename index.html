<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="https://knibbs-humanities-reading.stillbear32.chatgpt.site/">
  <title>Week 1 Humanities • Mrs Knibbs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      font-family: "Poppins", Arial, sans-serif;
      color: #223b3a;
      background: #f5f6ef;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }

    header {
      background: #244e48;
      color: white;
      padding: 30px max(20px, calc((100vw - 1100px) / 2));
    }

    h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin: 8px 0;
    }

    header p {
      max-width: 720px;
      line-height: 1.6;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: bold;
      color: #cce2bd;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 24px 20px;
    }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button, .link {
      font: inherit;
      border: 1px solid #adc3b5;
      background: white;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      color: #244e48;
      font-weight: bold;
    }

    button[aria-pressed="true"] {
      background: #244e48;
      color: white;
    }

    button:focus-visible, a:focus-visible {
      outline: 3px solid #cc8200;
      outline-offset: 3px;
    }

    .groups button {
      flex: 1;
      min-width: 140px;
    }

    .card {
      background: white;
      border: 1px solid #dce2d6;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 5px 15px #233a2810;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    h3 { margin-top: 0; }
    p, li { line-height: 1.65; }

    .session {
      background: #fff0cf;
      border-left: 5px solid #bf8121;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .tag {
      display: inline-block;
      border-radius: 20px;
      background: #e8f0dc;
      padding: 5px 12px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    audio {
      width: 100%;
      margin: 10px 0;
    }

    .resource {
      background: #f1f5ed;
      padding: 20px;
      border-radius: 12px;
      margin-top: 16px;
    }

    .questions li { margin-bottom: 14px; }

    .vocab {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .vocab span {
      padding: 8px 12px;
      background: #e7eef8;
      border-radius: 8px;
    }

    details { margin-top: 15px; }

    summary {
      cursor: pointer;
      font-weight: bold;
      padding: 12px 0;
    }

    .pages img {
      width: 100%;
      height: auto;
      margin: 12px 0;
      border: 1px solid #ddd;
    }

    .muted {
      color: #5c6c65;
      font-size: 14px;
    }

    footer {
      font-size: 13px;
      padding: 20px;
      color: #59695d;
      text-align: center;
    }

    a { color: #255c81; }

    .routine {
      border-top: 1px solid #dde4d8;
      padding-top: 15px;
    }

    .loading { padding: 30px; }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .card { padding: 18px; }
      .groups button { min-width: 95px; }
      nav button { padding: 10px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="eyebrow">
      Term 4 • Week 1 • Compassionate • Mrs Knibbs
    </div>

    <h1>Reading taskboard</h1>

    <p>
      Choose your lesson and group. Read or listen carefully,
      explain your thinking and use evidence.
      How can understanding others help us show compassion?
    </p>
  </header>

  <main>
    <nav id="lessons" aria-label="Choose lesson"></nav>
    <nav class="groups" id="groups" aria-label="Choose group"></nav>

    <div id="content" aria-live="polite">
      <p class="loading">Loading reading resources…</p>
    </div>
  </main>

  <footer>Term 4 Reading Mrs Knibbs</footer>

  <script src="app.js"></script>
</body>
</html>
